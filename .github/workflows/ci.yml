name: CI

permissions:
  contents: read

env:
  CHECKPOINT_DISABLE: '1'

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test:
    name: Build, lint, test, audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: mysql://root:library@localhost:3306/library

      - name: Lint
        run: npx --no-install eslint "{src,apps,libs,test,agent}/**/*.ts"

      - name: Build
        run: npm run build

      - name: Unit tests with coverage
        run: npm run test:ci

      - name: Security audit
        run: npm audit --audit-level=moderate

  mysql-compose:
    name: MySQL end-to-end and Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: library-ci-${{ github.run_id }}-${{ github.run_attempt }}
      MYSQL_DATABASE: library_ci
      MYSQL_USER: library_ci
      MYSQL_PASSWORD: disposable-ci-password
      MYSQL_ROOT_PASSWORD: disposable-ci-root-password
      LIBRARY_API_PORT: '3100'
      LIBRARY_MYSQL_PORT: '3307'
      DATABASE_URL: mysql://library_ci:disposable-ci-password@127.0.0.1:3307/library_ci?allowPublicKeyRetrieval=true

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build and start the disposable stack
        run: docker compose up --build --wait --wait-timeout 180

      - name: Check production health and OpenAPI documentation
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3100/health | jq -e '.service == "LibraryService" and .status == "ok"'
          curl --fail --silent --show-error http://127.0.0.1:3100/api-json | jq -e '.info.title == "LibraryService"'

      - name: Run database-backed tests
        run: npm run test:e2e -- --runInBand

      - name: Print container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Remove the disposable stack
        if: always()
        run: docker compose down --volumes --remove-orphans
